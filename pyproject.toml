[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-serena-mcp"
version = "1.2.0"
description = "Semantic Coding Agent IDE Toolkit & Live Documentation Engine MCP Server"
readme = "README.md"
authors = [
  { name = "NexusVibe AI Tech" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "ast", "serena-mcp", "claude-code", "cursor", "live-docs"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]

[project.scripts]
nexus-serena-mcp = "nexus_serena_mcp:main"

[project.urls]
Homepage = "https://github.com/jitendrakumar-ai/nexus-serena-mcp"
Repository = "https://github.com/jitendrakumar-ai/nexus-serena-mcp"
